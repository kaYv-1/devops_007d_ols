apiVersion: v1
kind: ConfigMap
metadata:
  name: micro-demo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  micro-demo.json: |
    {
      "title": "Micro Demo - DevOps",
      "schemaVersion": 39,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Solicitudes por segundo",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [{"expr": "sum(rate(micro_demo_http_requests_total[5m]))", "refId": "A"}]
        },
        {
          "id": 2,
          "title": "Errores HTTP por segundo",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "targets": [{"expr": "sum(rate(micro_demo_http_errors_total[5m]))", "refId": "A"}]
        },
        {
          "id": 3,
          "title": "Latencia p95",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(micro_demo_http_request_duration_seconds_bucket[5m])) by (le))", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
        },
        {
          "id": 4,
          "title": "Memoria RSS",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "targets": [{"expr": "sum(micro_demo_process_resident_memory_bytes)", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}
        },
        {
          "id": 5,
          "title": "CPU por pod",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
          "targets": [{
            "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"devops-staging\",container!=\"\",image!=\"\"}[5m]))",
            "refId": "A",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []}
        },
        {
          "id": 6,
          "title": "Memoria de trabajo por pod",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
          "targets": [{
            "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"devops-staging\",container!=\"\",image!=\"\"})",
            "refId": "A",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}
        },
        {
          "id": 7,
          "title": "Tiempo de último despliegue",
          "description": "Duración de deploy-aks desde el inicio del job hasta finalizar el smoke test.",
          "type": "stat",
          "gridPos": {"x": 0, "y": 24, "w": 6, "h": 5},
          "targets": [{
            "expr": "ci_deploy_duration_seconds{job=\"ci_cd_micro_demo\"}",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1,
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 8,
          "title": "Cobertura de pruebas",
          "type": "gauge",
          "gridPos": {"x": 6, "y": 24, "w": 6, "h": 5},
          "targets": [{
            "expr": "ci_test_coverage_percent{job=\"ci_cd_micro_demo\"}",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "unit": "percent",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "red", "value": null}, {"color": "green", "value": 80}]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "orientation": "auto",
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 9,
          "title": "Errores HTTP última hora",
          "type": "stat",
          "gridPos": {"x": 12, "y": 24, "w": 6, "h": 5},
          "targets": [{
            "expr": "sum(increase(micro_demo_http_errors_total[1h])) or vector(0)",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 10,
          "title": "Disponibilidad (up)",
          "type": "stat",
          "gridPos": {"x": 18, "y": 24, "w": 6, "h": 5},
          "targets": [{
            "expr": "avg(up{namespace=\"devops-staging\",service=\"micro-demo\"})",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]
              },
              "mappings": [{
                "type": "value",
                "options": {
                  "0": {"text": "No disponible", "color": "red"},
                  "1": {"text": "Disponible", "color": "green"}
                }
              }]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        }
      ]
    }
