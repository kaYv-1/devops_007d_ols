apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-007d-ols
  labels:
    app: devops-007d-ols
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-007d-ols
  template:
    metadata:
      labels:
        app: devops-007d-ols
    spec:
      containers:
        - name: app
          image: ghcr.io/kayv-1/devops_007d_ols:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
