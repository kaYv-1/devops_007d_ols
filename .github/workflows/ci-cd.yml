name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas y umbral de cobertura
        run: npm test

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            reports/coverage.txt
            coverage/lcov.info
          if-no-files-found: error

      - name: Publicar reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/test-report.html
          if-no-files-found: warn

  security:
    name: security
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar artifact de cobertura para SonarQube Cloud
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: .

      - name: Verificar reporte LCOV
        run: |
          if [ ! -s coverage/lcov.info ] || ! grep -q '^SF:' coverage/lcov.info; then
            echo "No se encontró un reporte LCOV válido en coverage/lcov.info." >&2
            exit 1
          fi

      - name: Validar requisitos de observabilidad y cumplimiento
        run: node scripts/validate-compliance.js

      - name: Validar configuración del token de Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "Configura el secret SNYK_TOKEN en el repositorio." >&2
            exit 1
          fi

      - name: Análisis de dependencias con Snyk
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04
        with:
          args: --severity-threshold=high --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Análisis de código con Snyk Code
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04
        with:
          command: code test
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Escaneo del filesystem con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Analizar calidad con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-scan-push:
    name: build-scan-push
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen con etiquetas OCI
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          REPOSITORY_LC="$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REF="ghcr.io/${OWNER_LC}/${REPOSITORY_LC}:${GITHUB_SHA::7}"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_ENV"
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "$IMAGE_REF" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Publicar imagen validada en GHCR
        run: docker push "${{ env.IMAGE_REF }}"

  deploy:
    name: deploy
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar variables para desplegar el commit
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          REPOSITORY_LC="$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "PORT=3000"
            echo "NODE_ENV=production"
            echo "IMAGE_NAME=ghcr.io/${OWNER_LC}/${REPOSITORY_LC}"
            echo "IMAGE_TAG=${GITHUB_SHA::7}"
            echo "NGINX_PORT=8080"
            echo "APP_REPLICAS=3"
          } > .env

      - name: Desplegar con Docker Compose la imagen escaneada
        run: |
          docker compose pull app
          docker compose up -d --no-build --scale app=3

      - name: Mostrar diagnóstico de Compose
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color app nginx || true

      - name: Smoke test
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          echo "El smoke test de staging falló después de 40 segundos." >&2
          exit 1

      - name: Mostrar estado del despliegue
        run: docker compose ps

  deploy-aks:
    name: deploy-aks
    needs: [test, build-scan-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AKS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    environment:
      name: staging
    steps:
      - name: Registrar inicio del despliegue
        run: echo "DEPLOY_START_SECONDS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar artifact de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: reports

      - name: Validar cobertura descargada
        run: |
          if [ ! -s reports/coverage.txt ]; then
            echo "No se encontró reports/coverage.txt en el artifact coverage." >&2
            exit 1
          fi
          COVERAGE_PERCENT="$(tr -d '[:space:]' < reports/coverage.txt)"
          if ! [[ "$COVERAGE_PERCENT" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "El artifact de cobertura no contiene un porcentaje numérico." >&2
            exit 1
          fi
          echo "TEST_COVERAGE_PERCENT=$COVERAGE_PERCENT" >> "$GITHUB_ENV"

      - name: Autenticar en Azure mediante OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Obtener contexto de AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Autenticar acceso de AKS a GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create namespace devops-staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-secret \
            --namespace devops-staging \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifiestos Kubernetes
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REPOSITORY_LC="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REF="ghcr.io/${OWNER_LC}/${REPOSITORY_LC}:${GITHUB_SHA::7}"
          sed -i "s|ghcr.io/kayv-1/devops_007d_ols:sha-placeholder|$IMAGE_REF|g" k8s/deployment.yaml
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Instalar Prometheus y Grafana
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
            --set prometheus.prometheusSpec.podMonitorSelectorNilUsesHelmValues=false \
            --set grafana.service.type=LoadBalancer \
            --set grafana.sidecar.dashboards.enabled=true \
            --set grafana.sidecar.dashboards.label=grafana_dashboard \
            --wait --timeout=10m
          kubectl apply -f k8s/servicemonitor.yaml
          kubectl apply -f k8s/prometheus-rules.yaml
          kubectl apply -f k8s/grafana-dashboard.yaml

      - name: Instalar Pushgateway y validar ServiceMonitor
        run: |
          helm upgrade --install pushgateway prometheus-community/prometheus-pushgateway \
            --namespace monitoring \
            --version 3.11.2 \
            --set serviceMonitor.enabled=true \
            --set serviceMonitor.namespace=monitoring \
            --set serviceMonitor.additionalLabels.release=kube-prometheus-stack \
            --set serviceMonitor.honorLabels=true \
            --wait --timeout=5m

          PUSHGATEWAY_SERVICE="$(kubectl get service \
            --namespace monitoring \
            --selector app.kubernetes.io/instance=pushgateway,app.kubernetes.io/name=prometheus-pushgateway \
            --output jsonpath='{.items[0].metadata.name}')"
          if [ "$PUSHGATEWAY_SERVICE" != "pushgateway-prometheus-pushgateway" ]; then
            echo "Nombre inesperado del Service Pushgateway: ${PUSHGATEWAY_SERVICE:-vacío}" >&2
            kubectl get service --namespace monitoring --show-labels
            exit 1
          fi
          kubectl get service "$PUSHGATEWAY_SERVICE" --namespace monitoring

          SERVICE_MONITOR=pushgateway-prometheus-pushgateway
          MONITOR_LABEL="$(kubectl get servicemonitor "$SERVICE_MONITOR" \
            --namespace monitoring \
            --output jsonpath='{.metadata.labels.release}')"
          HONOR_LABELS="$(kubectl get servicemonitor "$SERVICE_MONITOR" \
            --namespace monitoring \
            --output jsonpath='{.spec.endpoints[0].honorLabels}')"
          if [ "$MONITOR_LABEL" != "kube-prometheus-stack" ] || [ "$HONOR_LABELS" != "true" ]; then
            echo "ServiceMonitor inválido: release=${MONITOR_LABEL:-vacío}, honorLabels=${HONOR_LABELS:-vacío}" >&2
            exit 1
          fi
          echo "PUSHGATEWAY_SERVICE=$PUSHGATEWAY_SERVICE" >> "$GITHUB_ENV"

      - name: Esperar rollout
        id: rollout
        run: kubectl rollout status deployment/micro-demo --namespace devops-staging --timeout=180s

      - name: Diagnosticar rollout de AKS
        if: failure()
        run: |
          echo "=== Deployment ==="
          kubectl describe deployment micro-demo -n devops-staging || true
          echo "=== Pods ==="
          kubectl get pods -n devops-staging -o wide || true
          kubectl describe pods -n devops-staging || true
          echo "=== Eventos ==="
          kubectl get events -n devops-staging --sort-by=.lastTimestamp || true
          echo "=== Logs ==="
          kubectl logs -n devops-staging -l app.kubernetes.io/name=micro-demo --all-containers --tail=100 || true
          echo "=== Service ==="
          kubectl describe service micro-demo -n devops-staging || true

      - name: Esperar endpoint externo
        run: |
          for attempt in {1..30}; do
            EXTERNAL_IP="$(kubectl get service micro-demo -n devops-staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
            if [ -z "$EXTERNAL_IP" ]; then
              EXTERNAL_IP="$(kubectl get service micro-demo -n devops-staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            fi
            if [ -n "$EXTERNAL_IP" ]; then
              echo "EXTERNAL_IP=$EXTERNAL_IP" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          echo "El servicio de AKS no obtuvo una dirección externa." >&2
          kubectl describe service micro-demo -n devops-staging
          exit 1

      - name: Smoke test de AKS
        id: smoke-test
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent "http://${EXTERNAL_IP}/health"; then
              exit 0
            fi
            sleep 3
          done
          kubectl get pods,service -n devops-staging -o wide
          exit 1

      - name: Publicar métricas de CI/CD en Pushgateway
        if: always()
        env:
          DEPLOY_START_SECONDS: ${{ env.DEPLOY_START_SECONDS }}
          TEST_COVERAGE_PERCENT: ${{ env.TEST_COVERAGE_PERCENT }}
          PUSHGATEWAY_SERVICE: ${{ env.PUSHGATEWAY_SERVICE }}
        run: |
          set -euo pipefail
          DEPLOY_FINISH_SECONDS="$(date +%s)"
          if [ -z "${DEPLOY_START_SECONDS:-}" ]; then
            echo "No se registró la hora de inicio del job." >&2
            exit 1
          fi
          if [ -z "${TEST_COVERAGE_PERCENT:-}" ]; then
            echo "No se descargó un porcentaje de cobertura válido." >&2
            exit 1
          fi
          DEPLOY_DURATION_SECONDS=$((DEPLOY_FINISH_SECONDS - DEPLOY_START_SECONDS))
          DEPLOY_SUCCESS=0
          if [[ '${{ steps.rollout.outcome }}' == 'success' && '${{ steps.smoke-test.outcome }}' == 'success' ]]; then
            DEPLOY_SUCCESS=1
          fi

          if [ -z "${PUSHGATEWAY_SERVICE:-}" ]; then
            echo "No se verificó el Service de Pushgateway." >&2
            exit 1
          fi
          kubectl get service "$PUSHGATEWAY_SERVICE" --namespace monitoring

          PORT_FORWARD_LOG="$RUNNER_TEMP/pushgateway-port-forward.log"
          kubectl port-forward --namespace monitoring \
            "service/$PUSHGATEWAY_SERVICE" 19091:9091 > "$PORT_FORWARD_LOG" 2>&1 &
          PORT_FORWARD_PID=$!
          trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true; wait "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:19091/-/ready >/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$PORT_FORWARD_PID" 2>/dev/null; then
              cat "$PORT_FORWARD_LOG" >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat "$PORT_FORWARD_LOG" >&2
            echo "Pushgateway no respondió al port-forward." >&2
            exit 1
          fi

          curl --fail --silent --show-error --request PUT \
            --data-binary @- \
            http://127.0.0.1:19091/metrics/job/ci_cd_micro_demo <<EOF
          ci_deploy_duration_seconds ${DEPLOY_DURATION_SECONDS}
          ci_test_coverage_percent ${TEST_COVERAGE_PERCENT}
          ci_last_deploy_timestamp_seconds ${DEPLOY_FINISH_SECONDS}
          ci_last_deploy_success ${DEPLOY_SUCCESS}
          EOF

  alert:
    name: alert
    if: always() && github.event_name == 'push' && contains(needs.*.result, 'failure')
    needs: [test, security, build-scan-push, deploy, deploy-aks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Abrir issue por fallo del pipeline
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fallo del pipeline para ${context.sha.substring(0, 7)}`,
              body: `El workflow CI/CD falló para el commit ${context.sha}. Revisa los logs del job fallido y corrige el problema.`
            });
